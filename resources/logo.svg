<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">T3-like UsageBoard</title>
  <style>
    @media (max-width: 63px) {
      #pace-tick { stroke: #fff; stroke-width: 1px; vector-effect: non-scaling-stroke; }
