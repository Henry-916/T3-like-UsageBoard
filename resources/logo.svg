      <path d="M4 5h7v2.5H8.75V14h-2.5V7.5H4z M13 5h5.5L20 6.5v1.8l-1.1 1.2 1.1 1.2v1.8L18.5 14H13v-2h4.45l.45-.45V10.5h-3.35v-2h3.35V7.45L17.45 7H13z" fill="#f4f4f5"/>
