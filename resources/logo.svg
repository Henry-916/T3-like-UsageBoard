  <rect width="1024" height="1024" rx="224" fill="#000"/>
  <path d="M160 214h330v100H377v278H273V314H160z M570 214h200l94 88v70l-48 31 48 32v68l-94 89H570v-89h164l31-31v-20H633v-95h132v-24l-31-30H570z" fill="#f4f4f5"/>
